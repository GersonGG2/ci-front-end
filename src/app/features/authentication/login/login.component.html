<div class="auth-wrapper d-flex no-block justify-content-center align-items-center"
    style="background: url(assets/images/background/bc2.png) no-repeat center center; background-size: cover;">
    <div class="auth-box m-3 m-md-0">
        <div id="loginform" [ngClass]="{'d-none': recoverform}">
            <div class="text-center">
                <span class="db"><img src="assets/images/logo-icon-itz.svg" alt="logo" width="150" /></span>
                <h5 class="font-medium mb-4">Gestión de cursos</h5>
            </div>
            <!-- Form -->
            <div class="row">
                <div class="col-12">
                    <!-- MODIFICADO: Se agrega [formGroup]="loginForm" y (ngSubmit)="onSubmit()" -->
                    <form class="form-horizontal mt-3" id="loginform" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon1"><i class="ti-user"></i></span>
                            <input type="text" formControlName="username" class="form-control" placeholder="Correo">
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon2"><i class="ti-pencil"></i></span>
                            <input type="password" formControlName="password" class="form-control"
                                placeholder="Contraseña">
                        </div>
                        <!-- Mostrar mensaje de error -->
                        <div *ngIf="error" class="alert alert-danger">{{error}}</div>
                        <!-- Botón de login -->
                        <div class="form-group text-center mt-3">
                            <div class="col-xs-12">
                                <button type="submit" class="btn d-block w-100 btn-lg btn-primary" [disabled]="loading">
                                    <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
                                    Iniciar sesión
                                </button>
                            </div>
                        </div>
                        <div class="form-group row">
                            <div class="col-md-12">
                                <div class="form-check d-flex mt-3">
                                    <input type="checkbox" class="form-check-input" id="customCheck1">
                                    <label class="form-check-label fs-3 ms-2" for="customCheck1">Recordar
                                        contraseña</label>
                                    <!-- <a (click)="showRecoverForm()" href="javascript:void(0)" id="to-recover"
                                        class="text-dark fs-3 ms-auto"><i class="fa fa-lock me-2"></i> Forgot pwd?</a> -->
                                </div>
                            </div>
                        </div>
                        <!-- ELIMINADO: Botón de login con href, ya tienes el submit arriba -->
                        <!--  <div class="row mt-4">
                            <div class="col-xs-12 col-sm-12 col-md-12 mt-2 text-center">
                                <div class="social">
                                    <a href="javascript:void(0)" class="btn btn-primary me-2" data-toggle="tooltip"
                                        title="" data-original-title="Login with Facebook"> <i aria-hidden="true"
                                            class="fab fa-facebook-f"></i> </a>
                                    <a href="javascript:void(0)" class="btn btn-danger" data-toggle="tooltip" title=""
                                        data-original-title="Login with Google"> <i aria-hidden="true"
                                            class="fab fa-google-plus-g"></i> </a>
                                </div>
                            </div>
                        </div>
                        <div class="form-group mb-0 mt-2">
                            <div class="col-sm-12 text-center">
                                Don't have an account? <a href="authentication/signup" class="text-info ms-1"><b>Sign
                                        Up</b></a>
                            </div>
                        </div> -->
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>
