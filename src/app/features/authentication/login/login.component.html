<div class="auth-wrapper d-flex no-block justify-content-center align-items-center"
    style="background: url(assets/images/background/bc2.png) no-repeat center center; background-size: cover;">
    <div class="auth-box m-3 m-md-0">
        <div id="loginform" [ngClass]="{'d-none': recoverform}">
            <div class="text-center">
                <span class="db"><img src="assets/images/logo-icon-itz.svg" alt="logo" width="150" /></span>
                <h5 class="font-medium mb-4">Gestión de cursos</h5>
            </div>
            <!-- Form -->
            <div class="row">
                <div class="col-12">
                    <form class="form-horizontal mt-3" id="loginform" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                        
                        <!-- 🔥 Campo de Correo -->
                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text" id="basic-addon1"><i class="ti-user"></i></span>
                                <input 
                                    type="email" 
                                    formControlName="username" 
                                    class="form-control" 
                                    placeholder="Correo"
                                    [ngClass]="{'is-invalid': submitted && f['username'].errors}">
                            </div>
                            <!-- 👇 Mensajes de error del correo -->
                            <small *ngIf="submitted && f['username'].errors" class="text-danger d-block mt-1">
                                <span *ngIf="f['username'].errors['required']">El correo es requerido</span>
                                <span *ngIf="f['username'].errors['email']">Ingrese un correo válido</span>
                            </small>
                        </div>

                        <!-- 🔥 Campo de Contraseña -->
                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text" id="basic-addon2"><i class="ti-lock"></i></span>
                                <input 
                                    type="password" 
                                    formControlName="password" 
                                    class="form-control"
                                    placeholder="Contraseña"
                                    [ngClass]="{'is-invalid': submitted && f['password'].errors}">
                            </div>
                            <!-- 👇 Mensajes de error de la contraseña -->
                            <small *ngIf="submitted && f['password'].errors" class="text-danger d-block mt-1">
                                <span *ngIf="f['password'].errors['required']">La contraseña es requerida</span>
                                <span *ngIf="f['password'].errors['minlength']">Debe tener al menos 6 caracteres</span>
                            </small>
                        </div>

                        <!-- Mostrar mensaje de error del servidor -->
                        <div *ngIf="error" class="alert alert-danger">{{error}}</div>

                        <!-- Botón de login -->
                        <div class="form-group text-center mt-3">
                            <div class="col-xs-12">
                                <button type="submit" class="btn d-block w-100 btn-lg btn-primary" [disabled]="loading">
                                    <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                                    Iniciar sesión
                                </button>
                            </div>
                        </div>

                        <div class="form-group row">
                            <div class="col-md-12">
                                <div class="form-check d-flex mt-3">
                                    <input type="checkbox" class="form-check-input" id="customCheck1">
                                    <label class="form-check-label fs-3 ms-2" for="customCheck1">Recordar
                                        contraseña</label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
