<ng-template #content let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Aprobar/Rechazar documento</h5>
    <button type="button" class="btn-close" (click)="modal.dismiss('Cross click')" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <div class="container">
      <div class="row">
        <label class="col-sm-3 col-form-label">Creado por</label>
        <label class="col-sm-9 col-form-label">{{ record.createdBy }}</label>
      </div>

      <div class="row">
        <label class="col-sm-3 col-form-label">Fecha de creación</label>
        <label class="col-sm-9 col-form-label">{{ record.createdDate | date : 'dd-MM-yyyy HH:mm:ss' }}</label>
      </div>

      <ng-container *ngIf="record.isAdditional && record.lineStatus === 'Aprobado'">
        <div class="row">
          <label class="col-sm-3 col-form-label">Aprobado por</label>
          <label class="col-sm-9 col-form-label">{{ record.approveBy }}</label>
        </div>

        <div class="row">
          <label class="col-sm-3 col-form-label">Fecha de aprobación</label>
          <label class="col-sm-9 col-form-label">{{ record.approvalDate | date : 'dd-MM-yyyy HH:mm:ss' }}</label>
        </div>
      </ng-container>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="modal.dismiss('Close')">Cerrar</button>
  </div>
</ng-template>
