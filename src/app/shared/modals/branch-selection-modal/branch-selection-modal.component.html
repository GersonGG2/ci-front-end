<ng-template #content let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Actualizar sucursal</h5>
    <button type="button" class="btn-close" (click)="modal.dismiss('Cross click')" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <div class="mb-3">
      <label for="branchSelect" class="form-label">Sucursal</label>
      <div class="position-relative">
        <select class="form-select" id="branchSelect" [(ngModel)]="selectedBranchId">
          <option *ngFor="let branch of branches" [value]="branch.branchId">{{ branch.branchName }}</option>
        </select>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="modal.dismiss('Close')">Cerrar</button>
    <button type="button" class="btn btn-primary" (click)="updateBranch()">Guardar</button>
  </div>
</ng-template>
