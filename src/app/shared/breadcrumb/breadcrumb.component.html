<!-- ============================================================== -->
<!-- Bread crumb and right sidebar toggle -->
<!-- ============================================================== -->
<div class="page-breadcrumb">
    <div class="row" style="width: 100%;">
        <div class="col-md-5 align-self-center">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    @for (url of pageInfo?.['urls']; track url.title; let index = $index,last
                    = $last ) {
                    @if(!last){
                    <li class="breadcrumb-item" [routerLink]="url.url">
                        <a href='javascript:void(0)'>{{url.title}}</a>
                    </li>
                    }
                    @if(last){
                    <li class="breadcrumb-item active">{{url.title}}</li>
                    }
                    }

                </ol>
            </nav>
        </div>
        <div class="col-md-7 align-self-center">
            <div [ngClass]="{'d-flex': showBack, 'd-none': !showBack}" 
                class="d-flex align-items-center justify-content-start justify-content-md-end">
                <a href="javascript:void(0)" class="btn-info btn-sm" style="color: #1b396a;" (click)="confirmGoBack()">
                    <i class="fas fa-arrow-left"></i> <!-- Ícono de flecha hacia atrás -->
                  </a>
            </div>
        </div>
    </div>
</div>
<!-- ============================================================== -->
<!-- End Bread crumb and right sidebar toggle -->
<!-- ============================================================== -->
