<div class="row card-body">
  <!-- Primera columna con el formulario -->
  <div class="card col-lg-8">
    <div>
      <h4 class="card-title">DOC - Documentos</h4>
    </div>
  </div>
  <!--div class="card col-lg-4">
    <div class="d-flex justify-content-end pl-0">
      <button type="button" class="btn btn-danger btn-raised" (click)="savePlugins()">Guardar</button>
    </div>
  </div-->

  <!-- Segunda columna con el formulario -->
  <div class="col-lg-6">
    <form [formGroup]="pluginsForm">
      <div class="card border">
        <div class="card-body">
          <h4 class="card-title">COMPLEMENTOS</h4>
        </div>
        <div class="card-body">
          <h4 class="card-title">Placa Vin</h4>
          <div class="form-check form-check-inline mb-3">
            <input type="radio" id="vinPlate" name="vinPlate" formControlName="vinPlate" value="Y" class="form-check-input" />
            <label class="form-check-label" for="vinPlate">Sí</label>
          </div>
          <div class="form-check form-check-inline mb-3">
            <input type="radio" id="vinPlate" name="vinPlate" formControlName="vinPlate" value="N" class="form-check-input" />
            <label class="form-check-label" for="vinPlate">No</label>
          </div>
        </div>
        <div class="card-body">
          <h4 class="card-title">Tarjeta de circulación</h4>
          <div class="form-check form-check-inline mb-3">
            <input type="radio" id="circulationCard" name="circulationCard" formControlName="circulationCard" value="Y" class="form-check-input" />
            <label class="form-check-label" for="circulationCard">Sí</label>
          </div>
          <div class="form-check form-check-inline mb-3">
            <input type="radio" id="circulationCard" name="circulationCard" formControlName="circulationCard" value="N" class="form-check-input" />
            <label class="form-check-label" for="circulationCard">No</label>
          </div>
        </div>
        <div class="card-body">
          <h4 class="card-title">Holograma de verificación</h4>
          <div class="form-check form-check-inline mb-3">
            <input type="radio" id="verificationHologram" name="verificationHologram" formControlName="verificationHologram" value="Y" class="form-check-input" />
            <label class="form-check-label" for="verificationHologram">Sí</label>
          </div>
          <div class="form-check form-check-inline mb-3">
            <input type="radio" id="verificationHologram" name="verificationHologram" formControlName="verificationHologram" value="N" class="form-check-input" />
            <label class="form-check-label" for="verificationHologram">No</label>
          </div>
        </div>
        <div class="card-body">
          <h4 class="card-title">Dictamen de verificación</h4>
          <div class="form-check form-check-inline mb-3">
            <input type="radio" id="verificationDictum" name="verificationDictum" formControlName="verificationDictum" value="Y" class="form-check-input" />
            <label class="form-check-label" for="verificationDictum">Sí</label>
          </div>
          <div class="form-check form-check-inline mb-3">
            <input type="radio" id="verificationDictum" name="verificationDictum" formControlName="verificationDictum" value="N" class="form-check-input" />
            <label class="form-check-label" for="verificationDictum">No</label>
          </div>
        </div>
        <div class="card-body">
          <h4 class="card-title">Pedimento de importación</h4>
          <div class="form-check form-check-inline mb-3">
            <input type="radio" id="importRequest" name="importRequest" formControlName="importRequest" value="Y" class="form-check-input" />
            <label class="form-check-label" for="importRequest">Sí</label>
          </div>
          <div class="form-check form-check-inline mb-3">
            <input type="radio" id="importRequest" name="importRequest" formControlName="importRequest" value="N" class="form-check-input" />
            <label class="form-check-label" for="importRequest">No</label>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- Tercera columna con el formulario -->
